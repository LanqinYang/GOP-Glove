# Shared manuscript settings
project:
  name: GOP-Glove
data:
  num_sensors: 5
  sample_rate: 50
  sequence_length: 100
  num_classes: 11
  augmentation:
    enabled: true
    augment_factor: 1
    jitter_noise_level: 0.005
    scale_range: [0.98, 1.02]
    time_warp_max_speed: 2
    augment_prob: 0.3
  sliding_window_normalization:
    enabled: false
  preprocessing:
    normalize_method: standard
    fit_partition: train
    random_seed: 42
    iid_manifest: reproducibility/generated/iid_seed42.csv
    loso_manifest: reproducibility/generated/loso_seed42.csv
arduino:
  sensor_pins: [0, 1, 2, 3, 4]
  baud_rate: 115200
  collection_duration: 2.0
models:
  default_type: ADANN_LightGBM
  supported_types: [ADANN_LightGBM, ADANN, LightGBM, DSCNN, 1D_CNN, XGBoost, Transformer_Encoder, ADANN_GRL, ADANN_MMD, ADANN_CORAL]
inference:
  adann_confidence_threshold: 0.5
  lightgbm_confidence_threshold: 0.5
  confident_disagreement: probability_margin
  low_confidence_class: Static
  arduino:
    model_precision: FP32
    memory_limit: 262144
    flash_limit: 1048576
deployment:
  target_board: Arduino Nano 33 BLE Sense Rev2
  acquisition_seconds: 2.0
  reported_full_cycle_seconds: 2.5
  reported_post_acquisition_seconds_below: 0.5
paths:
  data:
    raw: datasets/gesture_csv
  outputs: outputs/manuscript
